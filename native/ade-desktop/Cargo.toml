[package]
name = "orca-ade-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[[bin]]
name = "orca-ade-desktop"
path = "src/main.rs"
required-features = ["desktop"]
